name: API CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dev_assess_test?schema=public
          DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/dev_assess_test?schema=public

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run isolated tests
        run: npm test

      - name: Build
        run: npm run build
